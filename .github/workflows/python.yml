name: Python
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: astrology
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: astrology
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U astrology -d astrology"
          --health-interval 5s --health-timeout 5s --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.20.0
        ports: ["6333:6333"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: 0.13.8
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - name: Wait for Qdrant readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:6333/readyz; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: uv run pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://astrology:ci-password@localhost:5432/astrology
          TEST_QDRANT_URL: http://localhost:6333
      - run: uv run ruff check src tests
      - run: uv run mypy src
