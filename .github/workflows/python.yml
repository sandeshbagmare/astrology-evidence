name: Python
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: astrology
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: astrology
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U astrology -d astrology"
          --health-interval 5s --health-timeout 5s --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.20.0
        ports: ["6333:6333"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: 0.13.8
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - name: Wait for Qdrant readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:6333/readyz; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: uv run pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://astrology:ci-password@localhost:5432/astrology
          TEST_QDRANT_URL: http://localhost:6333
      - run: uv run ruff check src tests
      - run: uv run mypy src
      - name: Build distributable wheel
        run: uv build --wheel
      - name: Check packaged web assets
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as package:
              names = set(package.namelist())
          for required in (
              "astrology_evidence/web/templates/source.html",
              "astrology_evidence/web/templates/profile_form.html",
              "astrology_evidence/web/static/app.js",
              "astrology_evidence/web/static/app.css",
              "astrology_evidence/web/static/favicon.svg",
          ):
              assert required in names, f"Missing packaged asset: {required}"
          print("Wheel includes required web assets")
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install pinned browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tools" --no-save --package-lock=false playwright@1.58.2
          node "$RUNNER_TEMP/browser-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify synthetic application in Chromium
        timeout-minutes: 5
        env:
          APP_ENV: test
          APP_PUBLIC_ORIGIN: http://127.0.0.1:8000
          DATABASE_URL: sqlite:///${{ runner.temp }}/browser-app.db
          AUTHENTICATION_ENABLED: 'false'
          DEV_LOGIN_ENABLED: 'false'
          AI_ENABLED: 'false'
          EMBEDDING_ENABLED: 'false'
          PLAYWRIGHT_PACKAGE_DIR: ${{ runner.temp }}/browser-tools/node_modules/playwright
        run: |
          .venv/bin/python -m uvicorn astrology_evidence.main:create_app --factory --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/browser-app.log" 2>&1 &
          app_pid=$!
          worker_pid=''
          cleanup() {
            if [ -n "$worker_pid" ]; then
              kill "$worker_pid" 2>/dev/null || true
              wait "$worker_pid" 2>/dev/null || true
            fi
            kill "$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready > /dev/null; then break; fi
            if ! kill -0 "$app_pid" 2>/dev/null; then cat "$RUNNER_TEMP/browser-app.log"; exit 1; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8000/health/ready > /dev/null
          .venv/bin/python -m astrology_evidence.jobs.worker > "$RUNNER_TEMP/browser-worker.log" 2>&1 &
          worker_pid=$!
          if ! node scripts/run-browser-check.mjs; then
            cat "$RUNNER_TEMP/browser-app.log" "$RUNNER_TEMP/browser-worker.log"
            exit 1
          fi
