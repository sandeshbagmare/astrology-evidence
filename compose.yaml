services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-astrology}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your shell or .env}
      POSTGRES_DB: ${POSTGRES_DB:-astrology}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333; printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3; read -r response <&3; [[ $$response == *' 200 '* ]]"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-astrology}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your shell or .env}@postgres:5432/${POSTGRES_DB:-astrology}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build: .
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-astrology}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your shell or .env}@postgres:5432/${POSTGRES_DB:-astrology}
      QDRANT_URL: http://qdrant:6333
      APP_PUBLIC_ORIGIN: http://127.0.0.1:8000
      DEV_LOGIN_ENABLED: "true"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 20
  worker:
    build: .
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-astrology}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your shell or .env}@postgres:5432/${POSTGRES_DB:-astrology}
    command: ["python", "-m", "astrology_evidence.jobs.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  qdrant_data:
