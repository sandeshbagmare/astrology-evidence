[project]
name = "astrology-evidence"
version = "0.1.0"
description = "Source-grounded astrology research application"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<2.1", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4",
  "authlib>=1.4,<2", "httpx>=0.28,<1", "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1", "langchain-openai==1.7.0", "openai==3.28.0", "jiter==0.17.0", "langgraph>=0.3,<2",
  "qdrant-client>=1.13,<2", "tzdata>=2025.1", "pysweph>=2.10.3.6,<3; python_version < '3.14'",
  "regex>=2024.11", "cryptography>=44", "itsdangerous>=2.2,<3"
]
[project.optional-dependencies]
embeddings = ["sentence-transformers>=3,<6"]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.9,<1", "mypy>=1.14,<2"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
